[project]
name = "safeguard-frontier"
version = "0.1.0"
description = "Measuring what agent safeguards cost: attack success against benign completion for assistants that read untrusted content"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "inspect-ai",
    "anthropic",
    "python-dotenv",
    "matplotlib>=3.11.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["safeguard_frontier"]
